# Settings the workflow's scripts read. Installed to work/config.conf; every key is optional and
# falls back to the default shown. Commit it — a clone without it silently uses these defaults.
#
# Format: KEY=value, one per line, no spaces around '='. An environment variable of the same name
# outranks this file for a one-off override.

INTEGRATION_TARGET=main         # branch bundles land on, and ticket branches are cut from
MERGE_METHOD=squash             # gh pr merge flag: squash | merge | rebase
WORKTREE_DIR=.claude/worktrees  # ticket worktrees; the path under it mirrors the branch name
